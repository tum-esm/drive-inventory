# DRIVE run configuration: Munich, 2025 traffic model.
# Relative paths: data_root relative to this file, everything else relative to data_root.

paths:
  data_root: ../data
  store: restricted_input/drive.duckdb
  calendar: auxiliary/calender_18to26.xlsx   # v1's workbook, only read for comparisons with v1
  clip_boundary: geodata/munich_boarders.gpkg
  results: inventory/v2

# VISUM models: raw exports; counter -> link matchings are stored per model for links that exist in it
traffic_models:
  visum2019:
    links: restricted_input/traffic_model_2019/analyse_2019_link.SHP
    zones: restricted_input/traffic_model_2019/analyse_2019_zone.SHP
    crs: EPSG:25832
    zone_columns: {qv_pkw: PC_starts, qv_lkw_k: LCV_starts}
  visum2025:
    links: restricted_input/traffic_model_2025/analyse_2025_link.SHP
    zones: restricted_input/traffic_model_2025/analyse_2025_zone.SHP
    crs: EPSG:25832
    # shapefile field names are cut to 10 characters
    link_columns:
      Kfz_Bela~1: SUMME_KFZ
      VOLVEH_T~2: BEL_LKW_G
      VOLVEH_T~3: BEL_LKW_K
      VOLVEH_T~4: BEL_LKW_M
      VOLVEH_T~5: BEL_PKW
    zone_columns: {OTRAFFIC_P: PC_starts, OTRAFFIC~7: LCV_starts, OTRAFFIC~8: HGV_starts}

# Conversion of the Munich VISUM model to HBEFA road types (model documentation, v1 preprocessing 21/21v2)
visum:
  min_dtv: 1
  road_types:
    - {typeno: [100, 199], road_type: Motorway-Nat}                                 # Autobahnen
    - {typeno: [200, 499], min_speed: 70, road_type: TrunkRoad/Primary-National}    # Bundes-, Staats-, Kreisstrassen
    - {typeno: [200, 499], road_type: Distributor/Secondary}
    - {typeno: [500, 699], road_type: Distributor/Secondary}                        # Gemeinde-, Hauptstrassen
    - {typeno: [700, 799], road_type: Access-residential}                           # Erschliessungsstrassen
    - {typeno: [800, 899], road_type: TrunkRoad/Primary-City}                       # Mittlerer Ring
  excluded_typeno:
    - [0, 10]       # closed and fictitious links, foot and cycle paths
    - [900, 999]    # public transport links

ingest:
  # Preprocessed counting data (outputs of data_preprocessing/11 and 12), 2018-2025.
  # The *_from2018 files contain the earlier 2019-2025 files unchanged plus 2018.
  counts:
    - source: LHM
      path: restricted_input/counting_data/lhm/MST_TrafficCounts_preprocessed_from2018.parquet
    - source: BASt
      path: restricted_input/counting_data/bast/BAST_TrafficCounts_preprocessed_from2018.parquet
  # Emission factor tables named {year}_{category}_{aggregation}_v{version}.parquet
  hbefa:
    directory: restricted_input/hbefa
    version: 501007
    # `drive ingest hbefa --download` requests the listed tables that aren't in the directory yet
    api:
      base_url: https://hbefa-server-repo.azurewebsites.net
      env_file: ../utils/.env   # HBEFA_EMAIL, HBEFA_PASSWORD; to be moved outside the repo (spec 4.7)
      # Parameter ids are explained in notebooks/data_preprocessing/00_retrieve_ef.ipynb
      request:
        country: D
        pollutant: CO,NOx,NO2,CO2(rep),CO2(total),PM10-ex,CH4,PM10-nx,PM2.5-ex,BC-ex,PM2.5-nx,BC-nx
        idvehcat: 1,2,14,6,9                 # PC, LCV, HGV, coach, motorcycle
        wgt: 'True'
        idtraffic_scen: '48'
        idtsgrad: '523'                      # D Ø-Urban UBA 2024
        agglevel_fleet: vehcat
        agglevel_energy: none
        nocorr: 'False'
        lang: en
        col_selection: standard
        col_titles: speaking
        load_in_rows: 'False'
        agg_cols: 'False'
        verbose: 'False'
        test_outputs: 'False'
        calc_wtt: 'True'
        idenergymix_scen: '3'
        idarea: '2'                          # urban
        idroadtype: 10,20,21,30,40,50        # Motorway-Nat, Primary-Nat, Primary-City, Distributor, Local, Access
        idpatternambientcond: 9901,9951,10001,10051,10101,10151,10201,10251   # -10 to +25 °C, tØ, dØ
      tables:
        - category: hot
          aggregation: single_ts
          years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
          request:
            idgrad: 30,54,56,58,62,64,66     # 0 %, -6 %, -4 %, -2 %, +2 %, +4 %, +6 %
        - category: hot
          aggregation: aggregate_ts
          years: [2024, 2025]
          request:
            idgrad: 30,54,56,58,62,64,66     # changes the mean: without it factors are up to 22 % higher (spec Q24)
        - category: start
          aggregation: aggregate_ts
          years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025]
          request:
            pollutant: CO,NOx,NO2,CO2(rep),CO2(total),PM10-ex,CH4,PM2.5-ex,BC-ex   # start factors have no non-exhaust part
  # Day types from the holidays package, see domain.calendar. Mariae Himmelfahrt (catholic) is a holiday in Munich,
  # not in all of Bavaria. The overrides correct school holidays that were changed after they were planned.
  calendar:
    country: DE
    subdivision: BY
    years: [2018, 2026]
    public_categories: [public, catholic]
    overrides: auxiliary/calendar_overrides_munich.csv

run:
  traffic_model: visum2025
  start: 2025-01-01
  end: 2025-12-31
  reference_year: 2025
  reference_day_type: 0    # normweekday
  data_version: null       # latest store batch; set a batch id to reproduce a run
  hbefa_version: 501007
  vehicle_classes: [PC, LCV, HGV, BUS, MOT]
  components: [CO, NOx, NO2, CO2(rep), CO2(total), PM10-ex, CH4, PM10-nx, PM2.5-ex, BC-ex, PM2.5-nx, BC-nx]
  hot_ambient_pattern: T+25°C,tØ,dØ    # v1 behaviour, R33 will select it by temperature
  area_type: Urban
  hot_mode: los_specific               # or aggregated: one mean factor (tables for 2024 and 2025 only)

# Hot emission kernel: limits of the volume/capacity ratio per LOS class (tuned by v1 notebook 01), HBS 2015 car units
kernel:
  vcr_thresholds:
    Motorway-Nat: [0.5, 0.71, 0.98, 1.1]
    Motorway-City: [0.55, 0.75, 0.9, 1]              # not used
    TrunkRoad/Primary-National: [0.33, 0.5, 0.7, 0.8]
    TrunkRoad/Primary-City: [0.67, 0.82, 0.92, 1.02]
    Distributor/Secondary: [0.37, 0.5, 0.63, 0.8]
    Local/Collector: [0.55, 0.75, 0.9, 1]            # not used
    Access-residential: [0.14, 0.25, 0.39, 0.52]
  car_unit_factors: {PC: 1, LCV: 1, MOT: 1, BUS: 1.75, HGV: 2.5}

# Counts quality control (v1 data_preprocessing/31 settings)
counts_qa:
  period_start: 2019-01-01   # outliers are detected over the whole period, so it affects every year (Q22)
  period_end: 2025-12-31
  completeness_window: [2025-01-01, 2025-12-31]
  hourly_daily_tolerance: 0.025
  min_daily_value: 1
  outlier_z_threshold: 3.5
  sqv_f: 10000
  sqv_threshold: 0.6
  completeness_threshold: 0.6
  iqr_range: [2.5, 97.5]

# Road types with too few counting stations are scaled like Distributor/Secondary
scaling_road_types:
  Access-residential: Distributor/Secondary
  Local/Collector: Distributor/Secondary
  Motorway-City: Motorway-Nat
  TrunkRoad/Primary-National: Distributor/Secondary
