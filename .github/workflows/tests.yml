# Lint, type check and known-answer tests on invented data (tests/README.md). No restricted data and no secrets.
name: tests

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - name: Install the locked dependencies
        run: uv sync --locked
      - name: Lint (ruff, settings in pyproject.toml)
        run: uv run ruff check
      - name: Type check drive/ (pyright basic mode with pandas-stubs)
        run: uv run pyright
      - name: Run the tests
        run: uv run pytest
