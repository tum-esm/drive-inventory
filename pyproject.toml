[project]
name = "drive-inventory"
version = "2.0.0.dev0"
description = "A data-driven framework to estimate road transport emissions."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bokeh>=3.7.1",
    "dotenv>=0.9.9",
    "duckdb>=2.0.0",
    "geopandas>=1.0.1",
    "holidays>=0.108",
    "ipython>=9.0.2",
    "jupyter>=1.1.1",
    "matplotlib>=3.10.1",
    "nbstripout>=0.9.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pandera>=0.35.0",
    "pyarrow>=19.0.1",
    "pydantic>=2.14.2",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "shapely>=2.0.7",
    "xlrd>=2.0.1",
]

[project.scripts]
drive = "drive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drive"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
