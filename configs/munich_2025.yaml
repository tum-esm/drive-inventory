# DRIVE run configuration: Munich, 2025 traffic model.
# Relative paths: data_root relative to this file, everything else relative to data_root.

paths:
  data_root: ../data
  store: restricted_input/drive.duckdb
  calendar: auxiliary/calender_18to26.xlsx

# VISUM models: raw exports; counter -> link matchings are stored per model for links that exist in it
traffic_models:
  visum2019:
    links: restricted_input/traffic_model_2019/analyse_2019_link.SHP
    zones: restricted_input/traffic_model_2019/analyse_2019_zone.SHP
    crs: EPSG:25832
    zone_columns: {qv_pkw: PC_starts, qv_lkw_k: LCV_starts}
  visum2025:
    links: restricted_input/traffic_model_2025/analyse_2025_link.SHP
    zones: restricted_input/traffic_model_2025/analyse_2025_zone.SHP
    crs: EPSG:25832
    # shapefile field names are cut to 10 characters
    link_columns:
      Kfz_Bela~1: SUMME_KFZ
      VOLVEH_T~2: BEL_LKW_G
      VOLVEH_T~3: BEL_LKW_K
      VOLVEH_T~4: BEL_LKW_M
      VOLVEH_T~5: BEL_PKW
    zone_columns: {OTRAFFIC_P: PC_starts, OTRAFFIC~7: LCV_starts, OTRAFFIC~8: HGV_starts}

# Conversion of the Munich VISUM model to HBEFA road types (model documentation, v1 preprocessing 21/21v2)
visum:
  min_dtv: 1
  road_types:
    - {typeno: [100, 199], road_type: Motorway-Nat}                                 # Autobahnen
    - {typeno: [200, 499], min_speed: 70, road_type: TrunkRoad/Primary-National}    # Bundes-, Staats-, Kreisstrassen
    - {typeno: [200, 499], road_type: Distributor/Secondary}
    - {typeno: [500, 699], road_type: Distributor/Secondary}                        # Gemeinde-, Hauptstrassen
    - {typeno: [700, 799], road_type: Access-residential}                           # Erschliessungsstrassen
    - {typeno: [800, 899], road_type: TrunkRoad/Primary-City}                       # Mittlerer Ring
  excluded_typeno:
    - [0, 10]       # closed and fictitious links, foot and cycle paths
    - [900, 999]    # public transport links

ingest:
  # Preprocessed counting data (outputs of data_preprocessing/11 and 12), 2018-2025.
  # The *_from2018 files contain the earlier 2019-2025 files unchanged plus 2018.
  counts:
    - source: LHM
      path: restricted_input/counting_data/lhm/MST_TrafficCounts_preprocessed_from2018.parquet
    - source: BASt
      path: restricted_input/counting_data/bast/BAST_TrafficCounts_preprocessed_from2018.parquet
  # Emission factor tables named {year}_{category}_{aggregation}_v{version}.parquet
  hbefa:
    directory: restricted_input/hbefa
    version: 501007

run:
  traffic_model: visum2025
  reference_year: 2025
  reference_day_type: 0    # normweekday
  data_version: null       # latest store batch; set a batch id to reproduce a run
  hbefa_version: 501007

# Counts quality control (v1 data_preprocessing/31 settings)
counts_qa:
  period_start: 2018-01-01
  period_end: 2025-12-31
  completeness_window: [2025-01-01, 2025-12-31]
  hourly_daily_tolerance: 0.025
  min_daily_value: 1
  outlier_z_threshold: 3.5
  sqv_f: 10000
  sqv_threshold: 0.6
  completeness_threshold: 0.6
  iqr_range: [2.5, 97.5]

# Road types with too few counting stations are scaled like Distributor/Secondary
scaling_road_types:
  Access-residential: Distributor/Secondary
  Local/Collector: Distributor/Secondary
  Motorway-City: Motorway-Nat
  TrunkRoad/Primary-National: Distributor/Secondary
